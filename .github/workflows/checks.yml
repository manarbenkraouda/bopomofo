name: Repository checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bunx prettier --check ../README.md ../CONTRIBUTING.md ../AGENTS.md ../docs

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ci_admin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Disposable runner-only credentials. The app must use a normal RLS role.
      TEST_DATABASE_URL: postgresql://bopomofo_ci:ci_only@127.0.0.1:5432/bopomofo_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv venv .venv && uv pip install --python .venv -r requirements-dev.txt
      - name: Create the disposable database
        env:
          PGPASSWORD: ci_admin
        run: |
          psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -c "CREATE ROLE bopomofo_ci LOGIN PASSWORD 'ci_only' NOSUPERUSER NOBYPASSRLS;"
          psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE bopomofo_test OWNER bopomofo_ci;"
      - run: .venv/bin/python -m ruff check .
      - run: .venv/bin/python -m ruff format --check .
      - run: .venv/bin/python ../.agents/skills/feature/scripts/check_registries.py
      - name: Test without speech weights or remote model calls
        run: .venv/bin/python -m pytest -q tests --ignore=tests/test_speech.py --ignore=tests/test_symbols.py --deselect=tests/test_llm.py::test_generate_sentences
